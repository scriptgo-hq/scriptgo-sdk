name: Release

# Push a tag `v<version>` whose version matches every published package.json, for example v0.1.0.
# The GitHub release of the tag gets the packed tarballs (installable by URL). npm also gets them when
# the repository secret NPM_TOKEN is set (an automation token with publish rights on @scriptgo).
on:
  push:
    tags: ["v*"]

permissions:
  contents: write # the GitHub release
  id-token: write # npm provenance

jobs:
  publish:
    runs-on: ubuntu-24.04
    env:
      HAS_NPM_TOKEN: ${{ secrets.NPM_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - name: Tag matches the package versions
        run: |
          tag="${GITHUB_REF_NAME#v}"
          for p in shared manifest escrow types; do
            v=$(node -p "require('./packages/$p/package.json').version")
            [ "$v" = "$tag" ] || { echo "packages/$p is $v, tag is $tag"; exit 1; }
          done
      - run: pnpm run typecheck
      - run: pnpm run test
      - name: Tarballs on the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p release
          for p in shared manifest escrow types; do (cd "packages/$p" && pnpm pack --pack-destination ../../release); done
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --title "SCRIPT//GO SDK ${GITHUB_REF_NAME#v}" --notes "npm packages as tarballs."
          gh release upload "$GITHUB_REF_NAME" release/*.tgz --clobber
      - name: Publish to npm
        if: env.HAS_NPM_TOKEN == 'true'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: "true"
        run: pnpm -r --filter "./packages/{shared,manifest,escrow,types}" publish --access public --no-git-checks
      - name: No token
        if: env.HAS_NPM_TOKEN != 'true'
        run: echo "::warning::NPM_TOKEN is not set; nothing was published."
